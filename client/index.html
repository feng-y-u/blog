<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>feng-y-u的小窝</title>
    <!--
      Cloudflare Web Analytics（可选）：在 Cloudflare 控制台
      「Analytics → Web Analytics → 添加站点」获取 token 后，
      把下面的 token 替换为真实值即可启用（无需再改其他代码）。
    -->
    <!-- <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "在此填入你的token"}'></script> -->
  </head>
  <body>
    <div id="root"></div>
    <!-- 首帧背景：CSS/JS 还没到时先按主题和路由铺底色，避免白屏一闪 -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('blog-theme') === 'dark'
          var home = location.pathname === '/' || location.pathname === ''
          document.documentElement.style.background = home
            ? '#0b0b12'
            : (dark ? '#0d0d14' : '#ffffff')
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
