<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首页加载策略 · 时间轴对比</title>
<style>
  :root {
    --bg: #0d0d14;
    --surface: #16161f;
    --card: #1a1a26;
    --border: #2a2a3a;
    --fg: #e4e4ed;
    --fg-secondary: #8888a0;
    --fg-muted: #5c5c70;
    --accent-pink: #ff4d6a;
    --accent-pink-dim: rgba(255, 77, 106, 0.25);
    --font-display: 'Maple Mono CN', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-display);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ===== 模拟视口 ===== */
  .stage {
    position: relative; flex: 1; overflow: hidden;
    background: #fff; color: #1a1a1a;
  }
  .stage.dark { background: #0d0d14; color: #e4e4ed; }

  .nav {
    position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; z-index: 5;
    font-size: 12px;
    background: var(--nav-bg, rgba(255,255,255,0.85));
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--nav-border, #f0f0f0);
  }
  .brand { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.15em; }
  .brand .mark { color: var(--accent-pink); font-size: 16px; letter-spacing: 0; }
  .navlinks { display: flex; gap: 20px; color: var(--nav-muted, #999); font-size: 12px; }
  .navlinks .active { color: var(--accent-pink); font-weight: 700; border-bottom: 2px solid var(--accent-pink); padding-bottom: 2px; }

  /* ===== 首屏 ===== */
  .hero {
    position: absolute; inset: 0; overflow: hidden;
    opacity: 0; pointer-events: none;
  }
  .hero.on { opacity: 1; }
  .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(18px) saturate(0.7) brightness(0.55); transform: scale(1.1); }
  .hero-shade { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .hero-content { position: absolute; inset: 0; padding-top: 120px; text-align: center; }
  .hero-badge { display: block; font-size: 10px; letter-spacing: 0.35em; color: rgba(232,213,232,0.35); margin-bottom: 32px; }
  .hero-title { display: inline-block; font-size: 56px; font-weight: 800; color: #f0e6f0; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
  .hero-rule { width: 48px; height: 2px; background: rgba(232,213,232,0.2); margin: 24px auto; border-radius: 1px; }
  .hero-sub { font-size: 14px; color: rgba(232,213,232,0.5); letter-spacing: 0.12em; margin: 0; }
  .hero-shell { position: absolute; inset: 0; background: #0b0b12; }

  /* ===== 骨架（现状） ===== */
  .skeleton { position: absolute; inset: 56px 0 0; padding: 24px; }
  .sk-card {
    border: 1px solid #eee; border-radius: 12px; padding: 18px 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .sk-line { height: 10px; border-radius: 4px; background: #f3f3f5; }
  .sk-line.sm { width: 18%; }
  .sk-line.lg { width: 62%; }
  .sk-line.md { width: 38%; }

  /* ===== 控制台 ===== */
  .panel {
    flex: 0 0 auto; padding: 12px 18px 14px;
    background: var(--surface); border-top: 1px solid var(--border);
    font-size: 12px; z-index: 10;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  .modes button, .speed button {
    padding: 7px 11px; font: inherit; font-size: 12px;
    color: var(--fg-secondary); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .modes button.on, .speed button.on {
    color: var(--accent-pink); border-color: var(--accent-pink-dim); background: var(--accent-pink-dim);
  }
  .play {
    padding: 7px 14px; font: inherit; font-size: 12px; color: var(--fg);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  input[type="range"] { flex: 1; min-width: 180px; -webkit-appearance: none; appearance: none; height: 3px; border-radius: 3px; background: var(--border); outline: none; cursor: ew-resize; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent-pink); }
  .clock { width: 92px; text-align: right; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .desc { margin: 10px 0 0; color: var(--fg-secondary); line-height: 1.7; }
  .desc b { color: var(--fg); }
  .desc .warn { color: var(--accent-pink); }
  .marks { display: flex; gap: 14px; color: var(--fg-muted); font-size: 11px; }
  .marks span::before { content: '◆ '; color: var(--accent-pink); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <nav class="nav" id="nav">
    <span class="brand" id="brand"><span class="mark">✦</span><span id="brandText">feng-y-u</span></span>
    <span class="navlinks"><span class="active">文章</span><span>索引</span><span>归档</span><span>⌕</span><span>☾</span></span>
  </nav>

  <div class="skeleton" id="skeleton">
    <div class="sk-card">
      <div class="sk-line sm"></div>
      <div class="sk-line lg"></div>
      <div class="sk-line md"></div>
    </div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-shell"></div>
    <img class="hero-fallback" id="fallback" src="glow.jpg" alt="" />
    <img class="hero-bg" id="heroBg" src="banner.jpg" alt="" />
    <div class="hero-shade"></div>
    <div class="hero-content" id="heroContent">
      <span class="hero-badge">✦ BLOG ✦</span>
      <h1 class="hero-title">feng-y-u</h1>
      <div class="hero-rule"></div>
      <p class="hero-sub">真正的勇敢，是在认清生活的真相之后，依然热爱生活。</p>
    </div>
  </div>
</div>

<div class="panel">
  <div class="row modes" id="modes"></div>
  <div class="row">
    <button class="play" id="play">▶ 播放</button>
    <input type="range" id="scrub" min="0" max="1500" value="0" step="1" />
    <span class="clock" id="clock">0 ms</span>
    <span class="speed" id="speed" style="display:flex;gap:6px">
      <button data-rate="0.25">0.25×</button>
      <button data-rate="1" class="on">1×</button>
      <button data-rate="2">2×</button>
    </span>
  </div>
  <div class="row marks"><span>settings 到达 500ms</span><span>posts 到达 1100ms</span></div>
  <p class="desc" id="desc"></p>
</div>

<script>
const T_SETTINGS = 500
const T_POSTS = 1100

const MODES = {
  now: {
    key: 'A', name: '现状 · 整页骨架',
    desc: '<b>A · 现状</b>：整页先给骨架，等到文章数据回来（1100ms）才一次性换成首屏。中间那 1.1 秒用户看到的是"一个还没长好的页面"，切换时是硬跳 —— 预览里把速度调到 0.25× 最明显。',
  },
  solid: {
    key: 'B', name: '首屏优先 · 纯色底',
    desc: '<b>B · 纯色底</b>：首帧就是纯深色的整屏（不显示任何错误内容），settings 一到（500ms）标题与图片同时淡入。绝对安全，代价是慢网络下开头是一块空黑屏 —— 比骨架更像"在加载"，但也更空。',
  },
  fallback: {
    key: 'C', name: '首屏优先 · 兜底图',
    desc: '<b>C · 兜底图</b>：首帧直接铺 <code>glow.jpg</code>（站点自带的兜底图，已模糊压暗），真图到了再交叉淡化。开头就有画面，观感最好；<span class="warn">风险是真图与兜底图差异大时，能看到一次"换图"</span>。',
  },
}

let mode = 'now'
let rate = 1
let t = 0
let raf = 0
let playing = false

const stage = document.getElementById('stage')
const skeleton = document.getElementById('skeleton')
const hero = document.getElementById('hero')
const heroBg = document.getElementById('heroBg')
const fallback = document.getElementById('fallback')
const heroContent = document.getElementById('heroContent')
const brand = document.getElementById('brand')
const brandText = document.getElementById('brandText')
const scrub = document.getElementById('scrub')
const clock = document.getElementById('clock')
const playBtn = document.getElementById('play')
const desc = document.getElementById('desc')

const clamp01 = v => Math.min(1, Math.max(0, v))

function render() {
  clock.textContent = Math.round(t) + ' ms'
  if (document.activeElement !== scrub) scrub.value = String(Math.round(t))

  const settingsIn = clamp01((t - T_SETTINGS) / 280)   // 文字/图片淡入
  const postsIn = t >= T_POSTS

  // 站名：所有策略在首屏阶段都隐藏（刚修好的那个瑕疵）
  brand.style.opacity = '0'

  if (mode === 'now') {
    skeleton.style.display = postsIn ? 'none' : ''
    hero.classList.toggle('on', postsIn)
    heroBg.style.opacity = '1'
    fallback.style.opacity = '0'
    heroContent.style.opacity = '1'
    return
  }

  skeleton.style.display = 'none'
  hero.classList.add('on')

  if (mode === 'solid') {
    heroBg.style.opacity = String(settingsIn)
    fallback.style.opacity = '0'
  } else {
    // C：兜底图先上，真图交叉淡化
    fallback.style.opacity = String(1 - settingsIn * 0.15)
    heroBg.style.opacity = String(settingsIn)
  }
  heroContent.style.opacity = String(settingsIn)
}

function tick(now) {
  if (!playing) return
  const dt = now - last
  last = now
  t += dt * rate
  if (t >= 1500) {
    t = 1500
    playing = false
    playBtn.textContent = '↻ 重播'
  }
  render()
  raf = requestAnimationFrame(tick)
}
let last = 0

function play() {
  cancelAnimationFrame(raf)
  t = 0
  render()
  playing = true
  playBtn.textContent = '❚❚ 暂停'
  last = performance.now()
  raf = requestAnimationFrame(tick)
}

playBtn.addEventListener('click', () => {
  if (playing) {
    playing = false
    cancelAnimationFrame(raf)
    playBtn.textContent = '▶ 继续'
    return
  }
  if (t >= 1500) { play(); return }
  playing = true
  playBtn.textContent = '❚❚ 暂停'
  last = performance.now()
  raf = requestAnimationFrame(tick)
})

scrub.addEventListener('input', () => {
  playing = false
  cancelAnimationFrame(raf)
  playBtn.textContent = '▶ 播放'
  t = Number(scrub.value)
  render()
})

const modesBox = document.getElementById('modes')
Object.entries(MODES).forEach(([key, m]) => {
  const b = document.createElement('button')
  b.textContent = m.key + ' · ' + m.name
  b.addEventListener('click', () => {
    mode = key
    t = 0
    ;[...modesBox.children].forEach(x => x.classList.toggle('on', x === b))
    desc.innerHTML = m.desc
    play()
  })
  modesBox.appendChild(b)
})

const speedBox = document.getElementById('speed')
;[...speedBox.children].forEach(b => {
  b.addEventListener('click', () => {
    rate = Number(b.dataset.rate)
    ;[...speedBox.children].forEach(x => x.classList.toggle('on', x === b))
  })
})

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playBtn.click() }
})

render()
desc.innerHTML = MODES.now.desc
modesBox.firstChild.classList.add('on')
</script>
</body>
</html>
